<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music | Andrew Ho</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="music.css" />
  </head>

  <body>
    <!-- ----------------------- navigation ----------------------- -->
    <header class="nav-header">
      <div class="container">
        <nav id="navbar">
          <a href="index.html#header" class="nav-logo">AH<span>.</span></a>
          <ul class="nav-links" id="navLinks">
            <li><a href="index.html#header">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="index.html#experience">Experience</a></li>
            <li><a href="music.html" class="active">last.fm</a></li>
            <li><a href="index.html#contact">Contact</a></li>
          </ul>
          <div class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </nav>
      </div>
    </header>

    <!-- ----------------------- music section ----------------------- -->
    <section class="music-page-section" id="music">
      <div class="container">
        <!-- Compact Hero Header -->
        <div class="music-compact-header">
          <div class="music-title-wrap">
            <h1 class="music-title">Listening History<span>.</span></h1>
            <div class="music-user-pill">
              <span class="user-live-dot" title="Live scrobbling active"></span>
              <span id="displayUsername">yungtract0r</span>
              <span class="user-badge-tag">Last.fm</span>
            </div>
          </div>

          <div class="music-header-actions">
            <a
              class="music-btn-profile"
              id="lfmProfileBtn"
              href="https://www.last.fm/user/yungtract0r"
              target="_blank"
              rel="noopener noreferrer"
            >
              Profile ↗
            </a>
          </div>
        </div>

        <!-- Integrated Toolbar (Category, Period & View) -->
        <div class="music-toolbar">
          <!-- Category Tabs: Overview, Artists, Albums, Tracks -->
          <div
            class="music-cat-tabs"
            role="tablist"
            aria-label="Music category"
          >
            <button
              class="cat-tab active"
              data-cat="all"
              role="tab"
              aria-selected="true"
            >
              Overview
            </button>
            <button
              class="cat-tab"
              data-cat="artists"
              role="tab"
              aria-selected="false"
            >
              Top Artists
            </button>
            <button
              class="cat-tab"
              data-cat="albums"
              role="tab"
              aria-selected="false"
            >
              Top Albums
            </button>
            <button
              class="cat-tab"
              data-cat="tracks"
              role="tab"
              aria-selected="false"
            >
              Tracks
            </button>
          </div>

          <!-- Right: Period Selector & View Toggle -->
          <div class="music-toolbar-right">
            <div
              class="toolbar-pill-group"
              role="group"
              aria-label="Time period"
            >
              <button
                class="period-pill active"
                data-period="7day"
                aria-pressed="true"
              >
                7D
              </button>
              <button
                class="period-pill"
                data-period="1month"
                aria-pressed="false"
              >
                1M
              </button>
              <button
                class="period-pill"
                data-period="12month"
                aria-pressed="false"
              >
                1Y
              </button>
              <button
                class="period-pill"
                data-period="overall"
                aria-pressed="false"
              >
                All
              </button>
            </div>

            <div class="toolbar-pill-group" role="group" aria-label="View mode">
              <button
                class="view-pill active"
                data-view="grid"
                aria-pressed="true"
                title="Grid layout"
              >
                Grid
              </button>
              <button
                class="view-pill"
                data-view="chart"
                aria-pressed="false"
                title="Chart layout"
              >
                Chart
              </button>
            </div>
          </div>
        </div>

        <!-- Content Area -->
        <div class="music-content-area">
          <!-- Section: Top Artists -->
          <div class="music-section-block" id="block-artists">
            <div class="block-header">
              <h2 class="block-title">Top Artists</h2>
              <span class="block-count" id="artistsCount">Top 10</span>
            </div>
            <div id="artists-container">
              <div class="music-cards-grid" id="artists-grid">
                <!-- Skeletons populated by JS -->
              </div>
            </div>
          </div>

          <!-- Section: Top Albums -->
          <div class="music-section-block" id="block-albums">
            <div class="block-header">
              <h2 class="block-title">Top Albums</h2>
              <span class="block-count" id="albumsCount">Top 10</span>
            </div>
            <div id="albums-container">
              <div class="music-cards-grid" id="albums-grid">
                <!-- Skeletons populated by JS -->
              </div>
            </div>
          </div>

          <!-- Section: Tracks Dual Panel (Top Tracks & Recent Scrobbles) -->
          <div class="music-section-block" id="block-tracks">
            <div class="tracks-dual-layout">
              <!-- Left: Top Tracks -->
              <div class="tracks-panel-card">
                <div class="tracks-panel-header">
                  <span class="tracks-panel-title">Top Tracks</span>
                  <span class="block-count">Top 10</span>
                </div>
                <div id="top-tracks-list">
                  <!-- Skeletons populated by JS -->
                </div>
              </div>

              <!-- Right: Recent Scrobbles -->
              <div class="tracks-panel-card">
                <div class="tracks-panel-header">
                  <span class="tracks-panel-title">Recent Scrobbles</span>
                  <span class="block-count">Live</span>
                </div>
                <div id="recent-tracks-list">
                  <!-- Skeletons populated by JS -->
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Ambient Interactive Waveform Bar -->
        <div class="music-ambient-wave" id="waveWrap">
          <canvas class="wave-viz" id="waveViz" aria-hidden="true"></canvas>
        </div>
      </div>
    </section>

    <!-- ----------------------- footer ----------------------- -->
    <footer class="footer">
      <div class="container footer-content">
        <div class="footer-left">
          <p>&copy; 2025 Andrew Ho. All Rights Reserved.</p>
        </div>
        <div class="footer-right">
          <a href="#header" class="back-to-top" title="Back to top">
            &uarr; Top
          </a>
        </div>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="music.js"></script>
  </body>
</html>
